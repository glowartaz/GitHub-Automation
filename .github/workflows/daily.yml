name: Daily GitHub Trending Video Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not update the permanent featured-repository history
        required: false
        type: boolean
        default: false
  schedule:
    # Runs daily at 6:00 AM Arizona time
    - cron: "0 13 * * *"

concurrency:
  group: github-trending-video-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install ".[dev]"

      - name: Validate application
        run: |
          ruff check .
          pytest

      - name: Generate daily package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          github-trending-video "${args[@]}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: github-trending-video-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Commit permanent history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/featured-repos.json
          git diff --cached --quiet || git commit -m "chore: record daily featured repositories"
          git push
